server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Los archivos con hash en el nombre no cambian: se pueden cachear mucho tiempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta del router de React devuelve index.html (sin caché).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # API Gateway. El nombre api-gateway lo resuelve la red de docker compose
  # (en Kubernetes sirve el mismo nombre si el Service se llama api-gateway).
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api-gateway:8080; }
  location = /ready  { proxy_pass http://api-gateway:8080; }
}
