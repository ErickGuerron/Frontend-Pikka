sonar.projectKey=pikka-frontend
sonar.projectName=Pikka Frontend

# Web (React + Vite) and mobile (Expo) share code from apps/shared. Tests, e2e and generated output are not analysed as sources.
sonar.sources=apps/web/src,apps/mobile/src,apps/shared
sonar.tests=apps/web/src,apps/web/e2e,apps/mobile/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/e2e/**/*.ts,**/__tests__/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/test/**,**/assets/**
sonar.sourceEncoding=UTF-8

# Entry points are not counted against coverage.
sonar.coverage.exclusions=**/main.tsx,**/e2e/**

# Reports are prepared by scripts/sonar-coverage.mjs (repo-relative paths).
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/mobile/coverage/lcov.info

# SonarCloud organization and project key come from CI variables (SONAR_ORGANIZATION,
# SONAR_PROJECT_KEY); the key above is the default for the local SonarQube.
